# Emprende+ Web Application
# Docker Compose configuration for development and production


services:
  app:
    build: .
    container_name: emprende_plus_web
    ports:
      - "3010:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NGINX_PORT=80
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - emprendenet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  emprendenet:
    driver: bridge
    name: emprende_plus_network
